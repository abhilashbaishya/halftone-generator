<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Browser-based halftone image generator with real-time preview, presets, and multi-format export." />
    <meta name="theme-color" content="#000000" />
    <script>
      (() => {
        const phone = matchMedia('(max-width: 767px), (max-width: 980px) and (max-height: 500px) and (pointer: coarse)').matches;
        let saved;
        try { saved = localStorage.getItem('halftone.theme'); } catch {}
        const theme = !phone && ['light', 'dark'].includes(saved) ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.classList.toggle('light', theme === 'light');
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f6f5f1' : '#1e1d1e';
      })();
    </script>
    <title>Halftone Studio</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Halftone Studio" />
    <meta property="og:description" content="Browser-based halftone image generator with real-time preview, presets, and multi-format export." />
    <meta property="og:url" content="https://lab.abhilashbaishya.cv/halftone-generator/" />
    <meta property="og:image" content="https://lab.abhilashbaishya.cv/halftone-generator/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Halftone Studio in white lettering on a black background." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Halftone Studio" />
    <meta name="twitter:description" content="Browser-based halftone image generator with real-time preview, presets, and multi-format export." />
    <meta name="twitter:image" content="https://lab.abhilashbaishya.cv/halftone-generator/og-image.png" />
    <meta name="twitter:image:alt" content="Halftone Studio in white lettering on a black background." />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="preload" href="./fonts/ABCDiatype-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/ABCDiatype-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1 class="sr-only app-title">Halftone Studio</h1>
    <main class="workspace">
      <aside class="control-rail">
        <input id="imageInput" class="sr-only" type="file" accept="image/*" tabindex="-1" aria-hidden="true" />
        <div id="dialPanelRoot" class="dial-panel-mount"></div>

        <div id="nativeControls" class="control-scroll" hidden aria-hidden="true">
        <section class="control-group">
          <div class="group-head">
            <h2>Source</h2>
          </div>
          <label class="field">
            <div class="field-title">
              <span>Preset</span>
            </div>
            <select id="presetSelect"></select>
          </label>
          <div class="preset-actions" id="presetActions">
            <button id="savePresetBtn" class="button" type="button" disabled>Save Preset</button>
            <button id="deletePresetBtn" class="button" type="button" hidden>Delete</button>
          </div>
          <div class="preset-namer" id="presetNamer" hidden>
            <input
              id="presetNameInput"
              type="text"
              placeholder="Preset name…"
              maxlength="40"
              spellcheck="false"
              autocomplete="off"
              aria-label="Preset name"
            />
            <button id="presetNameSave" class="button button-primary" type="button">Save</button>
            <button id="presetNameCancel" class="button preset-cancel" type="button" aria-label="Cancel">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
                <path d="M3 3L9 9M9 3L3 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <p id="presetNote" class="preset-note" role="status" aria-live="polite"></p>
        </section>

        <section class="control-group">
          <div class="group-head">
            <h2>Layout</h2>
          </div>
          <label class="field">
            <div class="field-title">
              <span>Cell Size</span>
              <output id="cellSizeOut" for="cellSize">8 px</output>
            </div>
            <input id="cellSize" type="range" min="3" max="20" value="8" />
          </label>
          <label class="field">
            <div class="field-title">
              <span>Screen Angle</span>
              <output id="angleOut" for="screenAngle">28 deg</output>
            </div>
            <input id="screenAngle" type="range" min="-75" max="75" value="28" />
          </label>
        </section>

        <section class="control-group">
          <div class="group-head">
            <h2>Tone</h2>
          </div>
          <label class="field">
            <div class="field-title">
              <span>Render Profile</span>
            </div>
            <select id="quality">
              <option value="draft">Draft</option>
              <option value="high" selected>High</option>
              <option value="ultra">Ultra</option>
              <option value="print">Print</option>
            </select>
          </label>
          <label class="field">
            <div class="field-title">
              <span>Contrast</span>
              <output id="contrastOut" for="contrast">1.10</output>
            </div>
            <input id="contrast" type="range" min="0.5" max="2.5" step="0.05" value="1.1" />
          </label>
          <details class="advanced-controls">
            <summary>Advanced controls</summary>
            <div class="advanced-fields">
              <label class="field">
                <div class="field-title">
                  <span>Gamma</span>
                  <output id="gammaOut" for="gamma">1.00</output>
                </div>
                <input id="gamma" type="range" min="0.4" max="2.4" step="0.01" value="1" />
              </label>
              <label class="field">
                <div class="field-title">
                  <span>Tone Curve</span>
                  <output id="toneCurveOut" for="toneCurve">0.88</output>
                </div>
                <input id="toneCurve" type="range" min="0.45" max="2.2" step="0.01" value="0.88" />
              </label>
              <label class="field">
                <div class="field-title">
                  <span>Minimum Dot</span>
                  <output id="minDotOut" for="minDot">0%</output>
                </div>
                <input id="minDot" type="range" min="0" max="60" value="0" />
              </label>
              <label class="field">
                <div class="field-title">
                  <span>Grain</span>
                  <output id="grainOut" for="grainStrength">0%</output>
                </div>
                <input id="grainStrength" type="range" min="0" max="100" step="1" value="0" />
              </label>
              <label class="field">
                <div class="field-title">
                  <span>Bloom</span>
                  <output id="bloomOut" for="bloomStrength">0%</output>
                </div>
                <input id="bloomStrength" type="range" min="0" max="100" step="1" value="0" />
              </label>
              <label class="field">
                <div class="field-title">
                  <span>CRT</span>
                  <output id="crtOut" for="crtStrength">0%</output>
                </div>
                <input id="crtStrength" type="range" min="0" max="100" step="1" value="0" />
              </label>
            </div>
          </details>
        </section>

        <section class="control-group">
          <div class="group-head">
            <h2>Colors</h2>
          </div>
          <div class="field split">
            <label>
              <span>Ink</span>
              <input id="inkColor" type="text" value="#111111" />
            </label>
            <label>
              <span>Paper</span>
              <input id="paperColor" type="text" value="#f5f5f5" />
            </label>
          </div>
        </section>
        </div>

        <div class="rail-actions">
          <div id="exportControlsRoot" class="export-controls-mount"></div>
          <p id="exportMeta" class="export-meta">WebP · Source resolution</p>
          <button id="exportBtn" class="button">Export WebP</button>
        </div>
      </aside>

      <section class="preview-stage">
        <div class="preview-toolbar">
          <label class="zoom-control" for="zoomRange">
            <span>Zoom</span>
            <output id="zoomOut" for="zoomRange">100%</output>
          </label>
          <input
            id="zoomRange"
            type="range"
            min="0"
            max="100"
            step="0.5"
            value="50"
            aria-valuemin="50"
            aria-valuemax="400"
            aria-valuenow="100"
            aria-valuetext="100%"
          />
          <button id="resetViewBtn" class="button" type="button">Reset Zoom</button>
          <button id="themeToggle" class="button button-small theme-toggle" type="button" aria-label="Switch to light mode">
            <svg id="iconSun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <circle cx="8" cy="8" r="3"/>
              <line x1="8" y1="1" x2="8" y2="2.5"/>
              <line x1="8" y1="13.5" x2="8" y2="15"/>
              <line x1="1" y1="8" x2="2.5" y2="8"/>
              <line x1="13.5" y1="8" x2="15" y2="8"/>
              <line x1="3.05" y1="3.05" x2="4.1" y2="4.1"/>
              <line x1="11.9" y1="11.9" x2="12.95" y2="12.95"/>
              <line x1="12.95" y1="3.05" x2="11.9" y2="4.1"/>
              <line x1="4.1" y1="11.9" x2="3.05" y2="12.95"/>
            </svg>
            <svg id="iconMoon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="display:none" aria-hidden="true">
              <path d="M13.5 10A6 6 0 0 1 6 2.5a6 6 0 1 0 7.5 7.5z"/>
            </svg>
          </button>
          <p id="renderStatus" class="render-status" aria-live="polite">Idle</p>
        </div>
        <div class="canvas-wrap" id="compareStage">
          <div class="canvas-plane" id="canvasPlane">
            <canvas id="sourceCanvas" width="1200" height="800" role="img" aria-label="Source image preview"></canvas>
            <div class="halftone-overlay" id="halftoneOverlay">
              <canvas id="previewCanvas" width="1200" height="800" role="img" aria-label="Processed halftone preview"></canvas>
            </div>
          </div>
          <button
            id="splitHandle"
            class="split-handle"
            type="button"
            role="slider"
            aria-label="Adjust split preview"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="50"
            aria-valuetext="50% halftone and 50% source"
            title="Drag to compare source and halftone"
          >
            <svg class="split-arrows" width="20" height="20" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M22 22L28 16L22 10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M10 22L4 16L10 10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
